version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      safe-updates:
        update-types: ["patch", "minor"]
    ignore:
      # Types track the Vercel runtime (Node 24.x), not npm latest. See DEPENDENCIES.md DEP-1.
      - dependency-name: "@types/node"
        versions: [">=25.0.0"]
    commit-message:
      prefix: "chore(deps)"
